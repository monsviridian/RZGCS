[metadata]
name = flight_control
version = 0.1.0
description = Flugsteuerungskomponenten für RZGCS
long_description = file: README.md
long_description_content_type = text/markdown
author = RZGCS Team
author_email = rzgcs@example.com
license = MIT
license_file = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Software Development :: Libraries :: Python Modules
keywords = flight control, uav, drone
project_urls =
    Homepage = https://github.com/rzgcs/flight_control
    Bug Tracker = https://github.com/rzgcs/flight_control/issues

[options]
packages = find:
python_requires = >=3.8
install_requires =
    PySide6>=6.0.0
    numpy>=1.20.0
    scipy>=1.7.0

[options.extras_require]
dev =
    pytest>=6.0.0
    pytest-cov>=2.0.0
    pytest-qt>=4.0.0

[options.package_data]
* = *.qml

[bdist_wheel]
universal = 1

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist
per-file-ignores =
    __init__.py: F401
max-complexity = 10

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 100

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --cov=flight_control

[coverage:run]
source = flight_control
omit = tests/*,setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError 